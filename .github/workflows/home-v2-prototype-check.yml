name: Home v2 prototype checks

on:
  pull_request:
    paths:
      - 'apps/marcelus-ai-lab/**'
      - '.github/workflows/home-v2-prototype-check.yml'
  push:
    branches:
      - feat/marcelus-home-v2-design-prototype
      - fix/home-headings-no-periods
      - fix/public-contact-links-and-email
      - feat/villa-website-contact-cta
      - feat/manzo-header-mark

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/marcelus-ai-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/marcelus-ai-lab/.nvmrc
          cache: npm
          cache-dependency-path: apps/marcelus-ai-lab/package-lock.json
      - name: Install pinned dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Privacy scan
        run: npm run privacy:check
      - name: Static export build (no deployment)
        env:
          NEXT_PUBLIC_SITE_ORIGIN: https://manzo8b.github.io
          NEXT_PUBLIC_BASE_PATH: /marcelus-v-v01
        run: npm run build
      - name: Verify released trilingual legal pages and metadata
        shell: bash
        run: |
          set -euo pipefail
          for locale in "" "it/" "es/"; do
            for route in legal legal/privacy legal/cookies; do
              page="out/${locale}${route}/index.html"
              test -s "$page"
              grep -Fq 'Marcelo Javier Fernandez Caballero' "$page"
              if grep -Eiq 'noindex|BOZZA IN REVISIONE|REVIEW DRAFT|BORRADOR EN REVISIÓN' "$page"; then
                echo "Unapproved metadata or draft marker found: $page"
                exit 1
              fi
            done
          done
          test -s out/sitemap.xml
          for url in '/legal/' '/legal/privacy/' '/legal/cookies/' '/it/legal/' '/it/legal/privacy/' '/it/legal/cookies/' '/es/legal/' '/es/legal/privacy/' '/es/legal/cookies/'; do
            grep -Fq "https://manzo8b.github.io/marcelus-v-v01${url}" out/sitemap.xml
          done
          test -s out/index.html
          test -s out/it/index.html
          test -s out/es/index.html
          test -s out/.nojekyll
          echo "Legal release export verified in all three languages."
